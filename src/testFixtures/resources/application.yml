spring:
  application:
    name: jwt-security
  shell:
    interactive:
      enabled: true

logging:
  level:
    org:
      springframework:
        security: DEBUG

kostack-security:
  issuer:
    kid: local
    name: security-local.kostack.io
    audience: kostack
    expiration-time: 900
  authorization-header:
    name: x-auth
    prefix: ""
  query-parameter:
    enabled: true
    name: token



